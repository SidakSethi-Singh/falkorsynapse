version: '3.8'

services:
  # FalkorDB official graph database instance
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkorsynapse-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb-data:/data
    restart: unless-stopped

  # FalkorSynapse Multi-Agent Swarm & Web UI
  synapse-app:
    build: .
    container_name: falkorsynapse-app
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH=synapse_enterprise_mesh
      - PORT=8000
    depends_on:
      - falkordb
    restart: unless-stopped

volumes:
  falkordb-data:
